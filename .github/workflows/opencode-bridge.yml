name: OpenCode bridge build and compatibility

on:
  push:
    branches: [opencode-bridge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            opencode: 1.18.35
          - os: windows-latest
            platform: windows-x64
            opencode: 1.18.35
          - os: ubuntu-latest
            platform: linux-x64
            opencode: 1.16.2
          - os: windows-latest
            platform: windows-x64
            opencode: 1.16.2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addons/opencode-bridge/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install bridge dependencies and the compatibility-test runtime
        run: |
          npm ci --prefix addons/opencode-bridge --ignore-scripts --no-audit --no-fund
          npm install --prefix bridge-runtime --no-audit --no-fund opencode-ai@${{ matrix.opencode }} @opencode-ai/plugin@${{ matrix.opencode }}
          node -e 'const fs=require("fs"),path=require("path"); const root=path.resolve("bridge-runtime/node_modules/opencode-ai"),pkg=require(path.join(root,"package.json")); const bin=path.resolve(root,typeof pkg.bin==="string"?pkg.bin:pkg.bin.opencode); fs.appendFileSync(process.env.GITHUB_ENV,"TEST_OPENCODE_COMMAND="+JSON.stringify([bin])+"\nTEST_OPENCODE_PLUGIN_DIR="+path.resolve("bridge-runtime/node_modules/@opencode-ai/plugin")+"\nTEST_OPENCODE_VERSION="+pkg.version+"\n")'
      - name: Unit and real OpenCode tests
        run: |
          npm test --prefix addons/opencode-bridge
          npm run test:integration --prefix addons/opencode-bridge
      - name: Real Magpie gateway and Bun plugin host with real OpenCode
        run: go test -tags nogui -count=1 -timeout 4m ./internal/gateway -run '^TestOpenCodeV1Bridge$'
      - name: Cold GUI local-plugin initialization
        run: go test -tags nogui -count=1 -timeout 2m ./internal/gui -run '^TestLocalPluginColdStartAttemptsHostInitialization$'
      - name: Verify Go and build Magpie
        if: matrix.opencode == '1.18.35'
        env:
          CGO_ENABLED: '0'
        run: |
          test -z "$(git show HEAD:internal/gateway/opencode_bridge_test.go | gofmt -d)"
          test -z "$(git show HEAD:internal/gui/plugins.go | gofmt -d)"
          test -z "$(git show HEAD:internal/gui/plugins_cold_test.go | gofmt -d)"
          go vet -tags nogui ./...
          mkdir -p artifacts
          if [ "$RUNNER_OS" = Windows ]; then
            go vet ./...
            go build -trimpath -ldflags='-s -w -X main.version=opencode-bridge-0.6.0' -o artifacts/magpie-windows-amd64.exe .
            go build -tags nogui -trimpath -ldflags='-s -w -X main.version=opencode-bridge-0.6.0' -o artifacts/magpie-cli-windows-amd64.exe .
          else
            go build -tags nogui -trimpath -ldflags='-s -w -X main.version=opencode-bridge-0.6.0' -o artifacts/magpie-cli-linux-amd64 .
          fi
      - name: Sandbox full terminal Go suite
        if: runner.os == 'Linux' && matrix.opencode == '1.18.35'
        run: |
          verification_home=$(mktemp -d)
          trap 'chmod -R u+w "$verification_home"; rm -rf "$verification_home"' EXIT
          verification_gopath=$(go env GOPATH)
          verification_modcache=$(go env GOMODCACHE)
          verification_buildcache=$(go env GOCACHE)
          HOME="$verification_home" GOPATH="$verification_gopath" GOMODCACHE="$verification_modcache" GOCACHE="$verification_buildcache" go test -tags nogui -timeout 20m ./...
      - name: Package addon
        if: matrix.opencode == '1.18.35'
        run: |
          npm pack ./addons/opencode-bridge --pack-destination artifacts
          cp addons/opencode-bridge/README.md artifacts/OpenCode-bridge-README.md
          cp addons/opencode-bridge/config.example.json artifacts/config.example.json
          cp addons/opencode-bridge/config.isolated.example.json artifacts/config.isolated.example.json
          node -e 'const fs=require("fs"),crypto=require("crypto"),path=require("path"); const lines=fs.readdirSync("artifacts").map(n=>crypto.createHash("sha256").update(fs.readFileSync(path.join("artifacts",n))).digest("hex")+"  "+n); fs.writeFileSync("artifacts/SHA256SUMS",lines.join("\n")+"\n")'
      - uses: actions/upload-artifact@v4
        if: matrix.opencode == '1.18.35'
        with:
          name: magpie-opencode-bridge-${{ matrix.platform }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
