name: OpenCode bridge plugin build and compatibility

on:
  push:
    branches: [opencode-bridge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            opencode: 1.18.35
          - os: windows-latest
            platform: windows-x64
            opencode: 1.18.35
          - os: ubuntu-latest
            platform: linux-x64
            opencode: 1.16.2
          - os: windows-latest
            platform: windows-x64
            opencode: 1.16.2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addons/opencode-bridge/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install bridge dependencies and the compatibility-test runtime
        run: |
          npm ci --prefix addons/opencode-bridge --ignore-scripts --no-audit --no-fund
          npm install --prefix bridge-runtime --no-audit --no-fund opencode-ai@${{ matrix.opencode }} @opencode-ai/plugin@${{ matrix.opencode }}
          node -e 'const fs=require("fs"),path=require("path"); const root=path.resolve("bridge-runtime/node_modules/opencode-ai"),pkg=require(path.join(root,"package.json")); const bin=path.resolve(root,typeof pkg.bin==="string"?pkg.bin:pkg.bin.opencode); fs.appendFileSync(process.env.GITHUB_ENV,"TEST_OPENCODE_COMMAND="+JSON.stringify([bin])+"\nTEST_OPENCODE_PLUGIN_DIR="+path.resolve("bridge-runtime/node_modules/@opencode-ai/plugin")+"\nTEST_OPENCODE_VERSION="+pkg.version+"\n")'
      - name: Unit and real OpenCode tests
        run: |
          npm test --prefix addons/opencode-bridge
          npm run test:integration --prefix addons/opencode-bridge
      - name: Pack the addon
        run: |
          mkdir -p bridge-package
          npm pack ./addons/opencode-bridge --ignore-scripts --pack-destination bridge-package
          node -e 'const fs=require("fs"),path=require("path"); const name=fs.readdirSync("bridge-package").find(n=>n.endsWith(".tgz")); fs.appendFileSync(process.env.GITHUB_ENV,"TEST_BRIDGE_PACKAGE="+path.resolve("bridge-package",name)+"\n")'
      - name: Download the unmodified official Magpie CLI for compatibility testing
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const windows = process.platform === 'win32';
          const name = windows ? 'magpie-cli-windows-amd64.exe' : 'magpie-cli-linux-amd64';
          const expected = windows ? '130d1e76ba4e0857a2d462255d4234208aae10aa77e7d6b2fd9a8431500dc9e1' : '90035828b08f4bffeadcf3a9860582491e47031cae11dfcb395dd8c72f132efd';
          const response = await fetch('https://github.com/yetone/magpie-releases/releases/download/v0.1.1141/' + name);
          if (!response.ok) throw new Error('Official Magpie download failed: HTTP ' + response.status);
          const bytes = Buffer.from(await response.arrayBuffer());
          if (crypto.createHash('sha256').update(bytes).digest('hex') !== expected) throw new Error('Official Magpie SHA256 mismatch');
          fs.mkdirSync('bridge-official', { recursive: true });
          const file = path.resolve('bridge-official', name);
          fs.writeFileSync(file, bytes, { mode: 0o755 });
          fs.appendFileSync(process.env.GITHUB_ENV, 'TEST_MAGPIE_COMMAND=' + JSON.stringify([file]) + '\n');
          NODE
      - name: Packaged addon on official Magpie and real OpenCode
        run: npm run test:magpie --prefix addons/opencode-bridge
      - name: Prepare plugin-only artifact
        if: runner.os == 'Linux' && matrix.opencode == '1.18.35'
        run: |
          mkdir -p artifacts
          cp bridge-package/*.tgz artifacts/
          cp addons/opencode-bridge/README.md artifacts/OpenCode-bridge-README.md
          cp addons/opencode-bridge/config.example.json artifacts/config.example.json
          cp addons/opencode-bridge/config.isolated.example.json artifacts/config.isolated.example.json
          node -e 'const fs=require("fs"),crypto=require("crypto"),path=require("path"); const lines=fs.readdirSync("artifacts").map(n=>crypto.createHash("sha256").update(fs.readFileSync(path.join("artifacts",n))).digest("hex")+"  "+n); fs.writeFileSync("artifacts/SHA256SUMS",lines.join("\n")+"\n")'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.opencode == '1.18.35'
        with:
          name: magpie-opencode-bridge-plugin
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
